version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
    labels: ["dependencies"]
    reviewers: ["ariellaureanorosas"]
    # Pacotes recém-publicados ficam de fora por uma semana: reduz a janela de
    # um comprometimento de cadeia de suprimentos chegar ao projeto.
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    labels: ["dependencies"]
    reviewers: ["ariellaureanorosas"]
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
