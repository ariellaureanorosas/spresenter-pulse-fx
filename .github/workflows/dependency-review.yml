name: Dependency review

# Revisa o diff de dependências em pull requests e falha em severidade alta.
# Em repositório privado exige GitHub Code Security; até lá o job é ignorado
# (defina ENABLE_GHAS=true depois de habilitar).

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    if: github.event.repository.private == false || vars.ENABLE_GHAS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
